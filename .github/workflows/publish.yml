name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to publish from
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: couimet/github-actions/setup-node-pnpm@main

      - uses: couimet/github-actions/install-deps@main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Guard real code changes (pre-release)
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          if [[ ! -f .changeset/pre.json ]]; then
            echo "::error::Manual dispatch requires pre-release mode. Run /publish-prerelease-prepare on the branch, then dispatch again."
            exit 1
          fi

          git fetch origin main --depth=20 --quiet

          real_changes=$(git diff --name-only origin/main...HEAD \
            | grep -v '^\.changeset/' \
            | grep -v '/package\.json$' \
            | grep -v '^package\.json$' \
            || true)

          if [[ -z "$real_changes" ]]; then
            echo "::error::Pre-release publish requires real code changes. Only changeset files and version bumps were modified."
            echo ""
            echo "At least one source file must change for a pre-release publish."
            exit 1
          fi

          echo "Real code changes found:"
          echo "$real_changes"

      - name: Build and test
        run: pnpm build && pnpm test

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail

          is_main="${{ github.ref == 'refs/heads/main' }}"

          rc=0
          if [[ "$is_main" == "true" ]]; then
            pnpm changeset publish 2>&1 | tee /tmp/publish-output.txt || rc=$?
          else
            pnpm changeset publish --no-git-tag 2>&1 | tee /tmp/publish-output.txt || rc=$?
          fi

          if [[ $rc -ne 0 ]]; then
            if grep -q '404 Not Found - PUT' /tmp/publish-output.txt; then
              echo "::error::Publish failed with a 404 on the publish PUT. Under trusted publishing this can mean the package has no trusted publisher, the repository, workflow file, or environment does not match the trust relationship, or the package does not exist yet. Check the trusted publisher for the package on npmjs.com."
            fi
            echo "::error::Publish command failed with exit code ${rc}"
            exit $rc
          fi

          if [[ "$is_main" != "true" ]]; then
            if grep -q "No unpublished projects to publish" /tmp/publish-output.txt; then
              echo "::error::No packages were published. This workflow was run manually — expected at least one publish."
              exit 1
            fi
          fi

      - name: Build PR comment body
        id: build-comment
        shell: bash
        run: |
          args=(--publish-output /tmp/publish-output.txt)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            args+=(--mode main --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA")
          else
            args+=(--mode prerelease --branch "${{ github.event.inputs.ref }}")
          fi
          scripts/build-pr-publish-comment.sh "${args[@]}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Post PR comment
        if: steps.build-comment.outputs.skip != 'true'
        uses: couimet/github-actions/publish-pr-comment@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          header: ${{ github.ref == 'refs/heads/main' && 'publish-release' || 'pre-release-publish' }}
          pr-number: ${{ steps.build-comment.outputs.pr_number }}
          comment-file: ${{ steps.build-comment.outputs.comment_file }}
          create-new: true

      - name: Push git tags
        if: github.ref == 'refs/heads/main'
        run: git push --tags origin
